<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Will you be my Valentine?</title>

  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>

  <style>
    :root {
      --bg1: #ffd6e7;
      --bg2: #ffeef6;
      --card: #ffffffcc;
      --yes: #ff3b7a;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100svh;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at top, var(--bg2), var(--bg1));
      font-family: system-ui, sans-serif;
      overflow: hidden;
      padding: 16px;
    }

    #confettiCanvas {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 9999;
    }

    .card {
      width: min(720px, 92vw);
      padding: 26px 22px;
      background: var(--card);
      backdrop-filter: blur(10px);
      border-radius: 22px;
      text-align: center;
      box-shadow: 0 18px 60px rgba(0,0,0,.15);
    }

    h1 {
      font-size: clamp(26px, 4vw, 44px);
      margin: 6px 0;
    }

    .button-zone {
      position: relative;
      width: min(520px, 92%);
      height: 170px;
      margin: 16px auto 0;
      touch-action: none;
    }

    button {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      padding: 16px 26px;
      font-size: 18px;
      font-weight: 800;
      border-radius: 999px;
      border: none;
      cursor: pointer;
      box-shadow: 0 10px 24px rgba(0,0,0,.14);
    }

    #yesBtn {
      left: 15%;
      background: var(--yes);
      color: white;
    }

    #noBtn {
      left: 62%;
      background: #e5e7eb;
      color: #111827;
    }

    .hint {
      margin-top: 10px;
      font-size: 14px;
      font-weight: 600;
      color: #ff1f68;
      min-height: 18px;
    }

    .result {
      display: none;
      margin-top: 20px;
      animation: pop .4s ease;
    }

    .result img {
      width: min(320px, 90%);
      border-radius: 16px;
      box-shadow: 0 12px 30px rgba(0,0,0,.2);
    }

    .result p {
      margin-top: 12px;
      font-size: 20px;
      font-weight: 700;
      color: #ff3b7a;
    }

    @keyframes pop {
      from { transform: scale(.95); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
  </style>
</head>

<body>
  <canvas id="confettiCanvas"></canvas>

  <main class="card">
    <h1>Diyu!!!</h1>
    <h1>Meri Jaan!!!</h1>
    <h1>Will you be my Valentine? 💖</h1>

    <section class="button-zone" id="zone">
      <button id="yesBtn">Yes</button>
      <button id="noBtn">No</button>
    </section>

    <div class="hint" id="hint">“No” seems a bit shy 😈</div>
    <div class="hint" id="tease"></div>

    <section class="result" id="result">
      <!-- 💘 GIF from example repo 💘 -->
      <img
        src="https://media.giphy.com/media/26ufdipQqU2lhNA4g/giphy.gif"
        alt="Valentine GIF"
      />
      <p>YAYYY!! 💘🥰</p>
    </section>
  </main>

  <script>
    const zone = document.getElementById("zone");
    const yesBtn = document.getElementById("yesBtn");
    const noBtn = document.getElementById("noBtn");
    const tease = document.getElementById("tease");
    const hint = document.getElementById("hint");
    const result = document.getElementById("result");

    const teaseLines = [
      "Why not? 🙂",
      "Are you serious? 😐",
      "Come onnn 😏",
      "Still no?? 🥲",
      "Okay… decision made 😌💘"
    ];

    let teaseIndex = 0;
    let escapeCount = 0;
    let yesScale = 1;
    const MAX_ESCAPES = 5;

    function updateTease() {
      tease.textContent = teaseLines[Math.min(teaseIndex, teaseLines.length - 1)];
      teaseIndex++;
    }

    function growYes() {
      yesScale = Math.min(3.2, yesScale + 0.25);
      yesBtn.style.transform = `translateY(-50%) scale(${yesScale})`;
    }

    function moveNo() {
      escapeCount++;
      updateTease();

      if (escapeCount >= MAX_ESCAPES) {
        noBtn.style.display = "none";
        yesBtn.style.left = "50%";
        yesBtn.style.top = "50%";
        yesBtn.style.transform = "translate(-50%, -50%) scale(3)";
        yesBtn.style.padding = "28px 50px";
        return;
      }

      const z = zone.getBoundingClientRect();
      const b = noBtn.getBoundingClientRect();

      noBtn.style.left = Math.random() * (z.width - b.width) + "px";
      noBtn.style.top  = Math.random() * (z.height - b.height) + "px";

      growYes();
    }

    noBtn.addEventListener("mouseenter", moveNo);
    noBtn.addEventListener("touchstart", e => {
      e.preventDefault();
      moveNo();
    });

    zone.addEventListener("pointermove", e => {
      const b = noBtn.getBoundingClientRect();
      const d = Math.hypot(
        e.clientX - (b.left + b.width / 2),
        e.clientY - (b.top + b.height / 2)
      );
      if (d < 120) moveNo();
    });

    const confettiCanvas = document.getElementById("confettiCanvas");
    const confettiInstance = confetti.create(confettiCanvas, { resize: true });

    yesBtn.addEventListener("click", () => {
      zone.style.display = "none";
      hint.style.display = "none";
      tease.style.display = "none";
      result.style.display = "block";

      confettiInstance({
        particleCount: 320,
        spread: 160,
        origin: { y: 0.6 }
      });
    });
  </script>
</body>
</html>
